<style>
/* ========================================================
   HOSPITAL DIRECTORY — DARK LUXURY GLASSMORPHISM
   ======================================================== */

:root {
  /* Core */
  --bg-base: #030a05;

  /* Gold (main accent) */
  --gold: #d4a843;
  --gold-bright: #e8c266;
  --gold-soft: rgba(212, 168, 67, 0.12);
  --gold-soft-2: rgba(212, 168, 67, 0.18);
  --gold-border: rgba(212, 168, 67, 0.3);
  --gold-glow: rgba(212, 168, 67, 0.4);

  /* Emergency (rose) */
  --rose: #fb7185;
  --rose-soft: rgba(251, 113, 133, 0.1);
  --rose-soft-2: rgba(251, 113, 133, 0.18);
  --rose-border: rgba(251, 113, 133, 0.25);

  /* Stat / amber */
  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.1);
  --amber-border: rgba(251, 191, 36, 0.25);

  /* Live */
  --emerald: #34d399;

  /* Glass surfaces */
  --glass-1: rgba(255, 255, 255, 0.03);
  --glass-2: rgba(255, 255, 255, 0.05);
  --glass-3: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-strong: rgba(255, 255, 255, 0.14);

  /* Text */
  --text-1: #eef5f0;
  --text-2: rgba(200, 230, 210, 0.65);
  --text-3: rgba(200, 230, 210, 0.5);
  --text-4: rgba(200, 230, 210, 0.3);

  /* Radii */
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* Fonts */
  --font-display: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --base-size: 11px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: var(--base-size);
  color: var(--text-1);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

html {
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,168,67,0.06), transparent 65%),
    radial-gradient(ellipse 80% 60% at 50% 110%, rgba(212,168,67,0.025), transparent 70%);
  background-attachment: fixed;
}

body {
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  background: transparent;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ========== HEADER ========== */
.app-header {
  flex-shrink: 0;
  padding: 0.85rem 1rem 0.7rem;
  background: rgba(3, 10, 5, 0.65);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--glass-border);
  z-index: 30;
  position: relative;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.logo-mark {
  width: 42px; height: 42px;
  flex-shrink: 0;
  border-radius: 11px;
  background: linear-gradient(140deg, rgba(212,168,67,0.18) 0%, rgba(212,168,67,0.05) 60%, transparent 100%);
  border: 1px solid var(--gold-border);
  box-shadow:
    0 0 18px rgba(212, 168, 67, 0.18),
    inset 0 1px 0 rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.logo-mark img { width: 170%; height: 170%; object-fit: contain; }
.logo-mark .logo-fallback {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--gold);
  font-size: 1rem;
  letter-spacing: 0.05em;
}

.brand-text { flex: 1; min-width: 0; }
.brand-text h1 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-1);
  line-height: 1.1;
}
.brand-text p {
  margin: 4px 0 0;
  font-size: 0.7rem;
  color: var(--text-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-button {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
  transition: transform 0.12s, background 0.15s, border-color 0.15s, color 0.15s;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.icon-button:active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
  transform: scale(0.92);
}

/* ========== RRT EMERGENCY BAR ========== */
.rrt-bar {
  flex-shrink: 0;
  padding: 0.55rem 1rem;
  background: linear-gradient(90deg,
              rgba(251,113,133,0.04),
              rgba(251,113,133,0.10) 50%,
              rgba(251,113,133,0.04));
  border-bottom: 1px solid var(--rose-border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.rrt-pulse {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--rose);
  animation: rrtPulse 1.7s infinite;
  flex-shrink: 0;
}
@keyframes rrtPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,0.55); }
  50%      { box-shadow: 0 0 0 7px rgba(251,113,133,0); }
}

.rrt-label {
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--rose);
}

.rrt-numbers {
  display: flex;
  gap: 0.4rem;
  flex: 1;
  justify-content: flex-end;
}

.rrt-call {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.32rem 0.6rem;
  background: var(--rose-soft);
  border: 1px solid var(--rose-border);
  border-radius: 9px;
}
.rrt-call-label {
  font-size: 0.6rem;
  color: var(--text-2);
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.rrt-call-num {
  font-family: var(--font-mono);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: 0.02em;
}

/* ========== HOSPITAL SWITCHBOARD (the only callable number) ========== */
.hospital-bar {
  flex-shrink: 0;
  padding: 0.6rem 1rem;
  background: linear-gradient(90deg,
              rgba(212,168,67,0.05),
              rgba(212,168,67,0.12) 50%,
              rgba(212,168,67,0.05));
  border-bottom: 1px solid var(--gold-border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.hospital-call {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.55rem 0.75rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 11px;
  transition: transform 0.12s, background 0.15s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 rgba(212,168,67,0);
}
.hospital-call:active {
  transform: scale(0.985);
  background: var(--gold-soft-2);
  box-shadow: 0 0 18px rgba(212,168,67,0.25);
}

.hospital-icon {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(212,168,67,0.3), rgba(212,168,67,0.1));
  border: 1px solid var(--gold-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  font-size: 1rem;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}

.hospital-info { flex: 1; min-width: 0; }
.hospital-info-label {
  font-size: 0.6rem;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.hospital-info-num {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: 0.06em;
  margin-top: 1px;
}

.hospital-cta {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.55rem 0.95rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 99px;
  flex-shrink: 0;
}
.hospital-action {
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hospital-icon.hospital-action:active,
.hospital-cta.hospital-action:active {
  transform: scale(0.96);
}

/* ========== SEARCH ========== */
.search-wrap {
  flex-shrink: 0;
  padding: 0.75rem 1rem 0.55rem;
  background: rgba(3, 10, 5, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.search-field { position: relative; }
.search-field .search-icon {
  position: absolute;
  left: 12px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px;
  color: var(--text-4);
  pointer-events: none;
  transition: color 0.15s;
}
.search-field input {
  width: 100%;
  height: 44px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 0 40px 0 38px;
  color: var(--text-1);
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.search-field input::placeholder { color: var(--text-4); }
.search-field input:focus {
  outline: none;
  border-color: var(--gold-border);
  box-shadow: 0 0 0 3px var(--gold-soft);
  background: var(--glass-3);
}
.search-field:focus-within .search-icon { color: var(--gold); }

.search-clear {
  position: absolute;
  right: 6px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--glass-3);
  color: var(--text-3);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
}
.search-field.has-text .search-clear { display: flex; }

/* ========== FILTER CHIPS / SORT ========== */
.filter-row {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.6rem;
  align-items: center;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.filter-row::-webkit-scrollbar { display: none; }

.chip {
  height: 34px;
  padding: 0 0.85rem;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-3);
  font-size: 0.83rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: transform 0.12s, background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.chip.active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold-soft);
}
.chip:active { transform: scale(0.95); }

.chip-count {
  font-size: 0.7rem;
  background: rgba(255,255,255,0.06);
  padding: 1px 7px;
  border-radius: 99px;
  color: var(--text-3);
  font-weight: 700;
  min-width: 22px;
  text-align: center;
}
.chip.active .chip-count {
  background: var(--gold-soft-2);
  color: var(--gold);
}

.sort-select {
  margin-left: auto;
  height: 34px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-2);
  padding: 0 28px 0 0.85rem;
  font-size: 0.82rem;
  font-weight: 600;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a843' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 14px;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.sort-select:focus { outline: none; border-color: var(--gold-border); }

/* Category chip row */
.category-row {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.55rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.category-row::-webkit-scrollbar { display: none; }

.cat-chip {
  height: 30px;
  padding: 0 0.7rem;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-3);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s, background 0.15s, color 0.15s, border-color 0.15s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.cat-chip.active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
}
.cat-chip:active { transform: scale(0.95); }

/* ========== LIST ========== */
.list-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.4rem 1rem 6rem;
  overscroll-behavior: contain;
}

.section-label {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.95rem 0.2rem 0.55rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-border), transparent);
}

.card {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.7rem 0.7rem 0.7rem 0.3rem;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card:active {
  background: var(--glass-3);
  border-color: var(--glass-border-strong);
  transform: scale(0.995);
}

.card-fav {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--text-4);
  font-size: 1.25rem;
  transition: color 0.15s, transform 0.15s, text-shadow 0.15s;
}
.card-fav.active {
  color: var(--amber);
  text-shadow: 0 0 14px rgba(251,191,36,0.55);
}
.card-fav:active { transform: scale(1.2); }

.card-body { flex: 1; min-width: 0; }
.card-service {
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1.3;
  margin-bottom: 0.22rem;
  word-break: break-word;
}
.card-category {
  display: inline-block;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  padding: 2px 8px;
  border-radius: 99px;
}

.card-ext {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.55rem 0.85rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
  min-height: 42px;
  min-width: 72px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}

/* Empty / Loading */
.empty-state {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--text-3);
}
.empty-state .ico {
  font-size: 2.5rem;
  margin-bottom: 0.7rem;
  opacity: 0.45;
  color: var(--gold);
}
.empty-state h3 {
  margin: 0 0 0.3rem;
  color: var(--text-2);
  font-size: 1rem;
  font-weight: 600;
}
.empty-state p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.45;
}

.skeleton {
  height: 70px;
  background: linear-gradient(90deg, var(--glass-1) 0%, var(--glass-3) 50%, var(--glass-1) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  border: 1px solid var(--glass-border);
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ========== STATUS BAR (bottom) ========== */
.status-bar {
  position: fixed;
  left: 0;
  right: 84px;
  bottom: 0;
  padding: 0.5rem 1rem calc(0.5rem + var(--safe-bottom));
  background: linear-gradient(180deg, transparent 0%, rgba(3,10,5,0.92) 55%);
  pointer-events: none;
  z-index: 20;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.7rem;
  color: var(--text-4);
}
.status-bar > * { pointer-events: auto; }

.live-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.75rem;
  background: var(--glass-2);
  border: 1px solid var(--gold-border);
  border-radius: 99px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  transition: transform 0.12s, opacity 0.2s, background 0.15s;
}
.live-pill:active { transform: scale(0.94); background: var(--gold-soft); }
.live-pill.syncing { animation: syncPulse 1.1s infinite; }
@keyframes syncPulse {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 1; }
}

.count-pill { color: var(--text-3); font-size: 0.8rem; }

/* ========== FAB (Printer) ========== */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(22px + var(--safe-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1px solid var(--gold-border);
  background:
    linear-gradient(135deg, rgba(212,168,67,0.4) 0%, rgba(212,168,67,0.15) 100%),
    rgba(3, 10, 5, 0.85);
  color: var(--gold);
  font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow:
    0 10px 28px rgba(0,0,0,0.5),
    0 0 22px rgba(212,168,67,0.25),
    inset 0 1px 0 rgba(255,255,255,0.1);
  z-index: 25;
  transition: transform 0.18s, box-shadow 0.2s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.fab:active {
  transform: scale(0.9);
  box-shadow:
    0 4px 14px rgba(0,0,0,0.4),
    0 0 30px rgba(212,168,67,0.4);
}

/* ========== BOTTOM SHEET ========== */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(3,10,5,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 80;
}
.sheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: rgba(8, 18, 11, 0.92);
  border-top: 1px solid var(--gold-border);
  border-radius: 24px 24px 0 0;
  transform: translateY(101%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  z-index: 90;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -12px 40px rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 40px; height: 4px;
  background: var(--gold);
  border-radius: 99px;
  margin: 0.65rem auto 0.3rem;
  opacity: 0.5;
}
.sheet-header {
  padding: 0.6rem 1.2rem 0.9rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--glass-border);
}
.sheet-title {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-1);
}
.sheet-title .sheet-icon {
  font-size: 1.15rem;
  color: var(--gold);
}
.sheet-close {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
}
.sheet-body {
  overflow-y: auto;
  padding: 0.7rem 1rem 1rem;
  -webkit-overflow-scrolling: touch;
}

.printer-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.8rem 0.75rem;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 11px;
  margin-bottom: 0.55rem;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.printer-code {
  font-family: var(--font-mono);
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  padding: 0.4rem 0.6rem;
  border-radius: 8px;
  flex-shrink: 0;
  white-space: nowrap;
}
.printer-name {
  flex: 1;
  font-size: 0.9rem;
  color: var(--text-1);
  font-weight: 500;
  min-width: 0;
  word-break: break-word;
}

/* ========== SETTINGS POPOVER ========== */
.settings-pop {
  position: fixed;
  top: calc(64px + var(--safe-top));
  right: 12px;
  background: rgba(8, 18, 11, 0.94);
  border: 1px solid var(--gold-border);
  border-radius: 14px;
  padding: 0.75rem;
  box-shadow:
    0 24px 50px rgba(0,0,0,0.6),
    0 0 20px rgba(212,168,67,0.1);
  z-index: 70;
  opacity: 0;
  transform: scale(0.9) translateY(-6px);
  pointer-events: none;
  transform-origin: top right;
  transition: opacity 0.18s, transform 0.18s;
  min-width: 210px;
  max-width: 270px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.settings-pop.open {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}
.settings-pop h4 {
  margin: 0 0 0.45rem;
  padding: 0 0.25rem;
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}
.size-row {
  display: flex;
  gap: 0.35rem;
  align-items: center;
  background: var(--glass-1);
  border-radius: 11px;
  padding: 0.3rem;
  border: 1px solid var(--glass-border);
}
.size-row button {
  flex: 1;
  height: 34px;
  border-radius: 8px;
  background: var(--glass-2);
  color: var(--text-1);
  font-weight: 700;
  font-size: 0.95rem;
  transition: background 0.12s, color 0.12s;
}
.size-row button:active {
  background: var(--gold-soft);
  color: var(--gold);
}
.size-row .size-val {
  flex: 1.2;
  text-align: center;
  font-size: 0.83rem;
  color: var(--text-2);
  font-weight: 600;
  font-family: var(--font-mono);
}
.about-block {
  margin-top: 0.7rem;
  padding: 0.6rem 0.65rem;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 11px;
  font-size: 0.72rem;
  color: var(--text-3);
  line-height: 1.55;
}
.about-block strong {
  color: var(--text-1);
  font-weight: 600;
  display: block;
  margin-bottom: 3px;
  font-size: 0.78rem;
}
.about-block .author {
  color: var(--gold);
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.04em;
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + var(--safe-bottom));
  transform: translateX(-50%) translateY(16px);
  background: rgba(8, 18, 11, 0.95);
  border: 1px solid var(--gold-border);
  color: var(--text-1);
  padding: 0.6rem 1rem;
  border-radius: 99px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 110;
  opacity: 0;
  transition: opacity 0.22s, transform 0.22s;
  pointer-events: none;
  box-shadow:
    0 12px 30px rgba(0,0,0,0.55),
    0 0 16px rgba(212,168,67,0.15);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  max-width: 82vw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast-icon { color: var(--gold); font-weight: 700; }
.toast-icon.error { color: var(--rose); }

  if(!d||b==='shared'||disabledBuildings.has(b))return;

  const key=unitKey(building,department);
  if(!units.has(key))units.set(key,{department,building:canonicalBuilding(building)});
 }
 configs.filter(isActive).forEach(r=>{
  if(r.building){if(buildingParts(r.building).length===1)addUnit(r.department,r.building);return;}
  const locations=knownLocationsByDepartment.get(normalizeSearch(r.department));
  if(locations?.size)locations.forEach(b=>addUnit(r.department,b));else addUnit(r.department,'');
 });
 data.filter(r=>r.scope==='department').forEach(r=>addUnit(r.department,effectiveBuilding(r)));
 directoryUnits=[...units.values()].sort((a,b)=>a.department.localeCompare(b.department)||a.building.localeCompare(b.building));
}
function configuredUnits(){return directoryUnits;}
function effectiveBuilding(r){
 if(r.building)return canonicalBuilding(r.building);
 if(r.scope!=='department')return '';
 const locations=knownLocationsByDepartment.get(normalizeSearch(r.department));
 return locations?.size===1?[...locations.values()][0]:'';
}
function matchesBuilding(r){
 if(r.scope==='department')return !!selectedDepartment&&normalizeSearch(r.department)===normalizeSearch(selectedDepartment)&&buildingKey(effectiveBuilding(r))===buildingKey(selectedBuilding)&&directoryUnits.some(u=>unitKey(u.building,u.department)===unitKey(selectedBuilding,selectedDepartment));
 if(r.scope!=='hospital'||r.department)return false;
 if(!selectedBuilding||!r.building||r.buildings.includes('shared'))return true;
 return buildingParts(r.building).some(b=>buildingKey(b)===buildingKey(selectedBuilding));
}
function scopedRows(){return data.filter(r=>matchesBuilding(r));}
function persistLocation(){writeStorage(KEY_LOCATION,JSON.stringify({building:selectedBuilding,department:selectedDepartment}));}
function syncDepartmentControls(){
 const buildings=$('buildingSelect'),select=$('departmentSelect');
 selectedBuilding=BUILDINGS.find(b=>buildingKey(b)===buildingKey(selectedBuilding))||'';
 const units=configuredUnits();
 if(selectedDepartment&&!units.some(u=>unitKey(u.building,u.department)===unitKey(selectedBuilding,selectedDepartment))){
  const matches=units.filter(u=>normalizeSearch(u.department)===normalizeSearch(selectedDepartment));
  if(matches.length===1){selectedBuilding=matches[0].building;selectedDepartment=matches[0].department;}else selectedDepartment='';
 }
 buildings.innerHTML='<option value="">All Hospital</option>'+BUILDINGS.map(b=>'<option value="'+escapeHtml(b)+'">'+escapeHtml(b)+'</option>').join('');buildings.value=selectedBuilding;
 const options=units.filter(u=>!selectedBuilding||buildingKey(u.building)===buildingKey(selectedBuilding));
 DEPARTMENTS=options.map(u=>u.department);
 select.disabled=!options.length;
 select.innerHTML='<option value="">'+(options.length?'All wings / departments':selectedBuilding?'No departments for this building':'No departments available')+'</option>'+options.map(u=>'<option value="'+escapeHtml(unitKey(u.building,u.department))+'">'+escapeHtml(u.department+(!selectedBuilding?' · '+(u.building||'Building not set'):''))+'</option>').join('');
 select.value=selectedDepartment?unitKey(selectedBuilding,selectedDepartment):'';
 const hint=$('departmentHint');
 hint.hidden=!selectedBuilding||!units.some(u=>!u.building);
 hint.textContent='Departments without a building are available under All Hospital.';
 persistLocation();
}
let toastTimer;
function showToast(msg,ok=true){$('toast').innerHTML='<span class="toast-icon'+(ok?'':' error')+'">'+(ok?'✓':'✕')+'</span><span>'+escapeHtml(msg)+'</span>';$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800);}
function syncBuildingControls(){
  syncDepartmentControls();
  $('savedHint').textContent=storageOK?'Saved on this device':'Saving unavailable in this browser';
  searchEl.disabled=false;
  searchEl.placeholder=selectedDepartment?'Search '+selectedDepartment+' & hospital services…':selectedBuilding?'Search '+selectedBuilding+' services…':'Search hospital service, category or extension…';
}
function renderStatus(){
 livePill.hidden=false;livePill.disabled=loadState==='loading';
 livePill.textContent=loadState==='loading'?'Updating…':loadState==='error'?'Retry update':'Refresh directory';
 livePill.title=lastUpdated?'Updated: '+new Date(lastUpdated).toLocaleString():'';
 $('dataNotice').hidden=loadState!=='error'&&!incompleteCount;
 $('dataNotice').textContent=loadState==='error'?'Update unavailable. Showing saved numbers from '+new Date(lastUpdated).toLocaleString()+'.':incompleteCount+' incomplete '+(incompleteCount===1?'entry is':'entries are')+' not shown. A name and extension are required.';
}
function renderRRT(){
 const actual=data.filter(r=>r.scope==='hospital'&&/\brrt\b/i.test(r.category+' '+r.service));
 const rows=actual.length?actual.map(r=>({label:r.service,extension:r.extension})):[{label:'ADULT',extension:'49337'},{label:'PEDS',extension:'45381'}];
 $('rrtBar').hidden=false;
 $('rrtBar').innerHTML='<span class="rrt-pulse" aria-hidden="true"></span><span class="rrt-label">RRT</span><div class="rrt-numbers">'+rows.map(r=>'<span class="rrt-call"><span class="rrt-call-label">'+escapeHtml(r.label)+'</span><span class="rrt-call-num">'+escapeHtml(r.extension)+'</span></span>').join('')+'</div>';
}
function renderCategoryChips(){
  const cats=[...new Set(scopedRows().map(r=>r.category))].sort((a,b)=>a.localeCompare(b));
  if(categoryFilter!==null&&!cats.includes(categoryFilter))categoryFilter=null;
  $('categoryRow').innerHTML=[null,...cats].map(c=>'<button class="cat-chip'+(categoryFilter===c?' active':'')+'" data-cat="'+escapeHtml(c??'')+'" aria-pressed="'+(categoryFilter===c)+'">'+escapeHtml(c??'All Categories')+'</button>').join('');
}
function render(){
  syncDepartmentControls();renderStatus();renderRRT();renderCategoryChips();
  const rows=scopedRows();
  $('countAll').textContent=rows.length;
  $('countFav').textContent=rows.filter(r=>favorites.has(makeKey(r))).length;
  $('chipAll').classList.toggle('active',currentView==='all');$('chipFav').classList.toggle('active',currentView==='fav');
  $('chipAll').setAttribute('aria-pressed',String(currentView==='all'));$('chipFav').setAttribute('aria-pressed',String(currentView==='fav'));
  const words=normalizeSearch(queryString).split(/\s+/).filter(Boolean);
  const list=rows.filter(r=>{
    if(currentView==='fav'&&!favorites.has(makeKey(r)))return false;
    if(categoryFilter!==null&&r.category!==categoryFilter)return false;
    const text=normalizeSearch([r.category,r.service,r.extension,r.aliases,r.department,locationLabel(r)].join(' '));
    return words.every(w=>text.includes(w));
  }).sort((a,b)=>(a.scope==='department'?0:1)-(b.scope==='department'?0:1)||a.category.localeCompare(b.category)||a.service.localeCompare(b.service)||locationLabel(a).localeCompare(locationLabel(b)));
  $('footerCount').textContent=list.length+' / '+rows.length;
  if(!data.length&&loadState==='loading'){listEl.innerHTML='<div class="skeleton"></div>'.repeat(5);listEl.setAttribute('aria-busy','true');return;}
  listEl.setAttribute('aria-busy','false');
  if(!list.length){
    const failed=!data.length&&loadState==='error';
    const title=failed?'Directory unavailable':!data.length?'No entries yet':currentView==='fav'?'No matching favorites':'No results';
    const description=failed?'The data service could not be reached.':!data.length?'The connected sheet returned an empty directory.':currentView==='fav'?'Tap a star to save an entry. Favorites follow the selected department.':selectedBuilding?'Try another name or select All Hospital.':'Try another name, extension or category.';
    listEl.innerHTML='<div class="empty-state"><div class="ico">'+(failed?'↻':'⌕')+'</div><h3>'+title+'</h3><p>'+description+'</p>'+(failed?'<button class="retry-button" data-action="retry">Try again</button>':'')+'</div>';return;
  }
  const groups=!words.length&&categoryFilter===null;let last=null;const html=[];
  for(const r of list){if(last!==r.scope){html.push('<div class="section-label scope-heading">'+escapeHtml(r.scope==='department'?selectedDepartment+' · WING / DEPARTMENT':'HOSPITAL SERVICES')+'</div>');last=r.scope;}
    const fav=favorites.has(makeKey(r));
    html.push('<div class="card"><button class="card-fav'+(fav?' active':'')+'" data-key="'+escapeHtml(makeKey(r))+'" aria-label="'+(fav?'Remove':'Add')+' favorite: '+escapeHtml(r.service)+'" aria-pressed="'+fav+'">★</button><div class="card-body"><div class="card-service">'+escapeHtml(r.service)+'</div>'+(groups?'':'<span class="card-category">'+escapeHtml(r.category)+'</span>')+'<span class="location-badge'+(r.scope==='unassigned'?' unassigned':'')+'">'+escapeHtml(locationLabel(r))+'</span></div><span class="card-ext">'+escapeHtml(r.extension)+'</span></div>');
  }
  listEl.innerHTML=html.join('');
}
let queryCounter=0;
function tableRecords(response){
 if(response?.status!=='ok'||!response.table)throw new Error('Sheet response unavailable');
 const headers=response.table.cols.map(c=>normalizeSearch(c.label));
 return response.table.rows.map(row=>Object.fromEntries(headers.map((key,i)=>[key,String(row.c?.[i]?.f??row.c?.[i]?.v??'').trim()]))).filter(row=>Object.values(row).some(Boolean));
}
function querySheet(gid,range){
 return new Promise((resolve,reject)=>{
  const callback='hospitalSheetResponse_'+(++queryCounter),script=document.createElement('script');
  let finished=false;
  function finish(err,response){if(finished)return;finished=true;clearTimeout(timer);script.remove();delete window[callback];err?reject(err):resolve(response);}
  const timer=setTimeout(()=>finish(new Error('Sheet request timed out')),15000);
  window[callback]=response=>{try{finish(null,tableRecords(response));}catch(e){finish(e);}};
  script.onerror=()=>finish(new Error('Sheet could not be reached'));
  script.onload=()=>{if(!finished)finish(new Error('Unexpected sheet response'));};
  const url=new URL('https://docs.google.com/spreadsheets/d/'+SPREADSHEET_ID+'/gviz/tq');
  url.searchParams.set('gid',String(gid));url.searchParams.set('headers','1');url.searchParams.set('range',range);
  url.searchParams.set('tqx','out:json;responseHandler:'+callback);url.searchParams.set('_',String(Date.now()));
  script.src=url.href;script.async=true;document.body.appendChild(script);
 });
}
async function fetchData(){
 const token=++requestToken;loadState='loading';render();
 const results=await Promise.allSettled([querySheet(0,'A:H'),querySheet(701,'A:C'),querySheet(702,'A:B')]);
 if(token!==requestToken)return;
 try{
  if(results.some(r=>r.status!=='fulfilled'))throw new Error('Directory configuration update unavailable');
  const raw=results[0].value;
  incompleteCount=raw.filter(r=>!r.service||!r.extension).length;
  data=normalizeRows(raw.filter(r=>r.service&&r.extension));lastUpdated=Date.now();loadState='ready';
  if(results[1].status==='fulfilled')UNITS=results[1].value;
  if(results[2].status==='fulfilled')BUILDING_CONFIG=results[2].value;
  refreshLocationIndex();
  migrateFavorites();writeStorage(KEY_DATA,JSON.stringify({rows:data,units:UNITS,buildings:BUILDINGS,buildingConfig:BUILDING_CONFIG,updatedAt:lastUpdated}));
 }catch(e){loadState='error';}
 syncBuildingControls();render();
}
function resetFilters(){categoryFilter=null;queryString='';searchEl.value='';searchWrap.classList.remove('has-text');}
$('buildingSelect').addEventListener('change',e=>{selectedBuilding=e.target.value;selectedDepartment='';resetFilters();syncBuildingControls();render();listEl.scrollTop=0;});
$('departmentSelect').addEventListener('change',e=>{const option=e.target.selectedOptions[0];const chosen=configuredUnits().find(u=>unitKey(u.building,u.department)===option.value);selectedDepartment=chosen?.department||'';if(chosen)selectedBuilding=chosen.building;resetFilters();syncBuildingControls();render();listEl.scrollTop=0;});
$('categoryRow').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){categoryFilter=b.dataset.cat||null;render();}});
listEl.addEventListener('click',e=>{if(e.target.closest('[data-action="retry"]')){fetchData();return;}const b=e.target.closest('[data-key]');if(!b)return;const key=b.dataset.key;if(favorites.has(key))favorites.delete(key);else favorites.add(key);if(!writeStorage(KEY_FAV,JSON.stringify([...favorites])))showToast('Favorites could not be saved on this device',false);render();});
searchEl.addEventListener('input',e=>{queryString=e.target.value.trim();searchWrap.classList.toggle('has-text',!!queryString);render();});
$('searchClear').addEventListener('click',()=>{searchEl.value='';queryString='';searchWrap.classList.remove('has-text');render();searchEl.focus();});
$('chipAll').addEventListener('click',()=>{currentView='all';render();});$('chipFav').addEventListener('click',()=>{currentView='fav';render();});
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();settingsPop.classList.toggle('open');$('settingsBtn').setAttribute('aria-expanded',String(settingsPop.classList.contains('open')));});
function closeSettings(){settingsPop.classList.remove('open');$('settingsBtn').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{if(!settingsPop.contains(e.target)&&!$('settingsBtn').contains(e.target))closeSettings();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings();});
function applySize(){document.documentElement.style.setProperty('--base-size',baseSize+'px');$('sizeVal').textContent=baseSize+'px';}
function resize(delta){baseSize=Math.max(11,Math.min(20,baseSize+delta));applySize();writeStorage(KEY_SIZE,String(baseSize));}
$('sizeUp').addEventListener('click',()=>resize(1));$('sizeDown').addEventListener('click',()=>resize(-1));


livePill.addEventListener('click',()=>fetchData());
window.addEventListener('online',()=>fetchData());
function init(){
 const savedSize=Number(readStorage(KEY_SIZE));if(savedSize>=11&&savedSize<=20)baseSize=savedSize;applySize();
 const fav=parseJSON(readStorage(KEY_FAV),[]);favorites=new Set(Array.isArray(fav)?fav:[]);
 data=normalizeRows(SEED_ROWS);lastUpdated=Date.parse(SEED_UPDATED_AT);
 const cached=parseJSON(readStorage(KEY_DATA),null);
 if(Array.isArray(cached?.units))UNITS=cached.units;
 if(Array.isArray(cached?.buildingConfig))BUILDING_CONFIG=cached.buildingConfig;
 else if(Array.isArray(cached?.buildings))BUILDING_CONFIG=cached.buildings.map(building=>({building,active:'TRUE'}));
 if(cached?.rows&&Number(cached.updatedAt)>lastUpdated){try{data=normalizeRows(cached.rows);lastUpdated=Number(cached.updatedAt);}catch(_){}}
 refreshLocationIndex();loadState='ready';syncBuildingControls();render();fetchData();
}
init();
