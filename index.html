<style>
/* ========================================================
   HOSPITAL DIRECTORY — DARK LUXURY GLASSMORPHISM
   ======================================================== */

:root {
  /* Core */
  --bg-base: #030a05;

  /* Gold (main accent) */
  --gold: #d4a843;
  --gold-bright: #e8c266;
  --gold-soft: rgba(212, 168, 67, 0.12);
  --gold-soft-2: rgba(212, 168, 67, 0.18);
  --gold-border: rgba(212, 168, 67, 0.3);
  --gold-glow: rgba(212, 168, 67, 0.4);

  /* Emergency (rose) */
  --rose: #fb7185;
  --rose-soft: rgba(251, 113, 133, 0.1);
  --rose-soft-2: rgba(251, 113, 133, 0.18);
  --rose-border: rgba(251, 113, 133, 0.25);

  /* Stat / amber */
  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.1);
  --amber-border: rgba(251, 191, 36, 0.25);

  /* Live */
  --emerald: #34d399;

  /* Glass surfaces */
  --glass-1: rgba(255, 255, 255, 0.03);
  --glass-2: rgba(255, 255, 255, 0.05);
  --glass-3: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-strong: rgba(255, 255, 255, 0.14);

  /* Text */
  --text-1: #eef5f0;
  --text-2: rgba(200, 230, 210, 0.65);
  --text-3: rgba(200, 230, 210, 0.5);
  --text-4: rgba(200, 230, 210, 0.3);

  /* Radii */
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* Fonts */
  --font-display: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --base-size: 11px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: var(--base-size);
  color: var(--text-1);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

html {
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,168,67,0.06), transparent 65%),
    radial-gradient(ellipse 80% 60% at 50% 110%, rgba(212,168,67,0.025), transparent 70%);
  background-attachment: fixed;
}

body {
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  background: transparent;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ========== HEADER ========== */
.app-header {
  flex-shrink: 0;
  padding: 0.85rem 1rem 0.7rem;
  background: rgba(3, 10, 5, 0.65);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--glass-border);
  z-index: 30;
  position: relative;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.logo-mark {
  width: 42px; height: 42px;
  flex-shrink: 0;
  border-radius: 11px;
  background: linear-gradient(140deg, rgba(212,168,67,0.18) 0%, rgba(212,168,67,0.05) 60%, transparent 100%);
  border: 1px solid var(--gold-border);
  box-shadow:
    0 0 18px rgba(212, 168, 67, 0.18),
    inset 0 1px 0 rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.logo-mark img { width: 170%; height: 170%; object-fit: contain; }
.logo-mark .logo-fallback {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--gold);
  font-size: 1rem;
  letter-spacing: 0.05em;
}

.brand-text { flex: 1; min-width: 0; }
.brand-text h1 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-1);
  line-height: 1.1;
}
.brand-text p {
  margin: 4px 0 0;
  font-size: 0.7rem;
  color: var(--text-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-button {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
  transition: transform 0.12s, background 0.15s, border-color 0.15s, color 0.15s;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.icon-button:active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
  transform: scale(0.92);
}

/* ========== RRT EMERGENCY BAR ========== */
.rrt-bar {
  flex-shrink: 0;
  padding: 0.55rem 1rem;
  background: linear-gradient(90deg,
              rgba(251,113,133,0.04),
              rgba(251,113,133,0.10) 50%,
              rgba(251,113,133,0.04));
  border-bottom: 1px solid var(--rose-border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.rrt-pulse {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--rose);
  animation: rrtPulse 1.7s infinite;
  flex-shrink: 0;
}
@keyframes rrtPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,0.55); }
  50%      { box-shadow: 0 0 0 7px rgba(251,113,133,0); }
}

.rrt-label {
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--rose);
}

.rrt-numbers {
  display: flex;
  gap: 0.4rem;
  flex: 1;
  justify-content: flex-end;
}

.rrt-call {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.32rem 0.6rem;
  background: var(--rose-soft);
  border: 1px solid var(--rose-border);
  border-radius: 9px;
}
.rrt-call-label {
  font-size: 0.6rem;
  color: var(--text-2);
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.rrt-call-num {
  font-family: var(--font-mono);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: 0.02em;
}

/* ========== HOSPITAL SWITCHBOARD (the only callable number) ========== */
.hospital-bar {
  flex-shrink: 0;
  padding: 0.6rem 1rem;
  background: linear-gradient(90deg,
              rgba(212,168,67,0.05),
              rgba(212,168,67,0.12) 50%,
              rgba(212,168,67,0.05));
  border-bottom: 1px solid var(--gold-border);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.hospital-call {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.55rem 0.75rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 11px;
  transition: transform 0.12s, background 0.15s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 rgba(212,168,67,0);
}
.hospital-call:active {
  transform: scale(0.985);
  background: var(--gold-soft-2);
  box-shadow: 0 0 18px rgba(212,168,67,0.25);
}

.hospital-icon {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(212,168,67,0.3), rgba(212,168,67,0.1));
  border: 1px solid var(--gold-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold);
  font-size: 1rem;
  flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}

.hospital-info { flex: 1; min-width: 0; }
.hospital-info-label {
  font-size: 0.6rem;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.hospital-info-num {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: 0.06em;
  margin-top: 1px;
}

.hospital-cta {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.55rem 0.95rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 99px;
  flex-shrink: 0;
}
.hospital-action {
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hospital-icon.hospital-action:active,
.hospital-cta.hospital-action:active {
  transform: scale(0.96);
}

/* ========== SEARCH ========== */
.search-wrap {
  flex-shrink: 0;
  padding: 0.75rem 1rem 0.55rem;
  background: rgba(3, 10, 5, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.search-field { position: relative; }
.search-field .search-icon {
  position: absolute;
  left: 12px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px;
  color: var(--text-4);
  pointer-events: none;
  transition: color 0.15s;
}
.search-field input {
  width: 100%;
  height: 44px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 0 40px 0 38px;
  color: var(--text-1);
  font-size: 16px;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.search-field input::placeholder { color: var(--text-4); }
.search-field input:focus {
  outline: none;
  border-color: var(--gold-border);
  box-shadow: 0 0 0 3px var(--gold-soft);
  background: var(--glass-3);
}
.search-field:focus-within .search-icon { color: var(--gold); }

.search-clear {
  position: absolute;
  right: 6px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--glass-3);
  color: var(--text-3);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
}
.search-field.has-text .search-clear { display: flex; }

/* ========== FILTER CHIPS / SORT ========== */
.filter-row {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.6rem;
  align-items: center;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.filter-row::-webkit-scrollbar { display: none; }

.chip {
  height: 34px;
  padding: 0 0.85rem;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-3);
  font-size: 0.83rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: transform 0.12s, background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.chip.active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold-soft);
}
.chip:active { transform: scale(0.95); }

.chip-count {
  font-size: 0.7rem;
  background: rgba(255,255,255,0.06);
  padding: 1px 7px;
  border-radius: 99px;
  color: var(--text-3);
  font-weight: 700;
  min-width: 22px;
  text-align: center;
}
.chip.active .chip-count {
  background: var(--gold-soft-2);
  color: var(--gold);
}

.sort-select {
  margin-left: auto;
  height: 34px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-2);
  padding: 0 28px 0 0.85rem;
  font-size: 0.82rem;
  font-weight: 600;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a843' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 14px;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.sort-select:focus { outline: none; border-color: var(--gold-border); }

/* Category chip row */
.category-row {
  display: flex;
  gap: 0.4rem;
  margin-top: 0.55rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.category-row::-webkit-scrollbar { display: none; }

.cat-chip {
  height: 30px;
  padding: 0 0.7rem;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-3);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s, background 0.15s, color 0.15s, border-color 0.15s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.cat-chip.active {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: var(--gold);
}
.cat-chip:active { transform: scale(0.95); }

/* ========== LIST ========== */
.list-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0.4rem 1rem 6rem;
  overscroll-behavior: contain;
}

.section-label {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.95rem 0.2rem 0.55rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-border), transparent);
}

.card {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.7rem 0.7rem 0.7rem 0.3rem;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  transition: transform 0.1s, background 0.15s, border-color 0.15s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card:active {
  background: var(--glass-3);
  border-color: var(--glass-border-strong);
  transform: scale(0.995);
}

.card-fav {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--text-4);
  font-size: 1.25rem;
  transition: color 0.15s, transform 0.15s, text-shadow 0.15s;
}
.card-fav.active {
  color: var(--amber);
  text-shadow: 0 0 14px rgba(251,191,36,0.55);
}
.card-fav:active { transform: scale(1.2); }

.card-body { flex: 1; min-width: 0; }
.card-service {
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1.3;
  margin-bottom: 0.22rem;
  word-break: break-word;
}
.card-category {
  display: inline-block;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  padding: 2px 8px;
  border-radius: 99px;
}

.card-ext {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.55rem 0.85rem;
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
  min-height: 42px;
  min-width: 72px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}

/* Empty / Loading */
.empty-state {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--text-3);
}
.empty-state .ico {
  font-size: 2.5rem;
  margin-bottom: 0.7rem;
  opacity: 0.45;
  color: var(--gold);
}
.empty-state h3 {
  margin: 0 0 0.3rem;
  color: var(--text-2);
  font-size: 1rem;
  font-weight: 600;
}
.empty-state p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.45;
}

.skeleton {
  height: 70px;
  background: linear-gradient(90deg, var(--glass-1) 0%, var(--glass-3) 50%, var(--glass-1) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  border: 1px solid var(--glass-border);
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ========== STATUS BAR (bottom) ========== */
.status-bar {
  position: fixed;
  left: 0;
  right: 84px;
  bottom: 0;
  padding: 0.5rem 1rem calc(0.5rem + var(--safe-bottom));
  background: linear-gradient(180deg, transparent 0%, rgba(3,10,5,0.92) 55%);
  pointer-events: none;
  z-index: 20;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.7rem;
  color: var(--text-4);
}
.status-bar > * { pointer-events: auto; }

.live-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.35rem 0.75rem;
  background: var(--glass-2);
  border: 1px solid var(--gold-border);
  border-radius: 99px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  transition: transform 0.12s, opacity 0.2s, background 0.15s;
}
.live-pill:active { transform: scale(0.94); background: var(--gold-soft); }
.live-pill.syncing { animation: syncPulse 1.1s infinite; }
@keyframes syncPulse {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 1; }
}

.count-pill { color: var(--text-3); font-size: 0.8rem; }

/* ========== FAB (Printer) ========== */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(22px + var(--safe-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1px solid var(--gold-border);
  background:
    linear-gradient(135deg, rgba(212,168,67,0.4) 0%, rgba(212,168,67,0.15) 100%),
    rgba(3, 10, 5, 0.85);
  color: var(--gold);
  font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow:
    0 10px 28px rgba(0,0,0,0.5),
    0 0 22px rgba(212,168,67,0.25),
    inset 0 1px 0 rgba(255,255,255,0.1);
  z-index: 25;

}
function renderStatus(){
  livePill.classList.toggle('syncing',loadState==='loading');
  livePill.textContent=loadState==='loading'?'Updating…':loadState==='error'?(data.length?'Saved data · Retry':'Connection failed · Retry'):'Refresh directory';
  livePill.title=lastUpdated?'Last successful update: '+new Date(lastUpdated).toLocaleString():'No successful update yet';
  const messages=[];
  if(loadState==='error') messages.push(data.length?'Update failed. Showing saved data'+(lastUpdated?' from '+new Date(lastUpdated).toLocaleString():'')+'.':'Could not load the directory. Check your connection and try again.');
  else if(loadState==='loading'&&data.length)messages.push('Showing saved data while checking for updates.');
  const n=data.filter(r=>r.scope==='unassigned').length;
  if(n)messages.push(n+(n===1?' entry has':' entries have')+' no complete location listed'+(selectedBuilding==='all'?'.':'; find them in All buildings.'));
  $('dataNotice').hidden=!messages.length;
  $('dataNotice').textContent=messages.join(' ');
  if(loadState==='error'){const b=document.createElement('button');b.textContent='Retry';b.addEventListener('click',()=>fetchData());$('dataNotice').append(' ',b);}
}
function renderRRT(){
  const rows=data.filter(r=>matchesBuilding(r)&&r.scope!=='unassigned'&&/\brrt\b/i.test(r.category+' '+r.service));
  $('rrtBar').hidden=!rows.length;
  $('rrtBar').innerHTML=rows.length?'<span class="rrt-pulse" aria-hidden="true"></span><span class="rrt-label">RRT</span><div class="rrt-numbers">'+rows.map(r=>'<span class="rrt-call"><span class="rrt-call-label">'+escapeHtml(r.service)+' · '+escapeHtml(locationLabel(r))+'</span><span class="rrt-call-num">'+escapeHtml(r.extension)+'</span></span>').join('')+'</div>':'';
}
function renderCategoryChips(){
  const cats=[...new Set(scopedRows().map(r=>r.category))].sort((a,b)=>a.localeCompare(b));
  if(categoryFilter!==null&&!cats.includes(categoryFilter))categoryFilter=null;
  $('categoryRow').innerHTML=[null,...cats].map(c=>'<button class="cat-chip'+(categoryFilter===c?' active':'')+'" data-cat="'+escapeHtml(c??'')+'" aria-pressed="'+(categoryFilter===c)+'">'+escapeHtml(c??'All Categories')+'</button>').join('');
}
function render(){
  syncDepartmentControls();renderStatus();renderRRT();renderCategoryChips();
  const rows=scopedRows();
  $('countAll').textContent=rows.length;
  $('countFav').textContent=rows.filter(r=>favorites.has(makeKey(r))).length;
  $('chipAll').classList.toggle('active',currentView==='all');$('chipFav').classList.toggle('active',currentView==='fav');
  $('chipAll').setAttribute('aria-pressed',String(currentView==='all'));$('chipFav').setAttribute('aria-pressed',String(currentView==='fav'));
  const words=normalizeSearch(queryString).split(/\s+/).filter(Boolean);
  const list=rows.filter(r=>{
    if(currentView==='fav'&&!favorites.has(makeKey(r)))return false;
    if(categoryFilter!==null&&r.category!==categoryFilter)return false;
    const text=normalizeSearch([r.category,r.service,r.extension,r.aliases,r.department,r.room,locationLabel(r)].join(' '));
    return words.every(w=>text.includes(w));
  }).sort((a,b)=>a.category.localeCompare(b.category)||a.service.localeCompare(b.service)||locationLabel(a).localeCompare(locationLabel(b)));
  $('footerCount').textContent=list.length+' / '+rows.length;
  if(!data.length&&loadState==='loading'){listEl.innerHTML='<div class="skeleton"></div>'.repeat(5);listEl.setAttribute('aria-busy','true');return;}
  listEl.setAttribute('aria-busy','false');
  if(!list.length){
    const failed=!data.length&&loadState==='error';
    const title=failed?'Directory unavailable':!data.length?'No entries yet':currentView==='fav'?'No matching favorites':'No results';
    const description=failed?'The data service could not be reached.':!data.length?'The connected sheet returned an empty directory.':currentView==='fav'?'Tap a star to save an entry. Favorites follow your building and search filters.':selectedBuilding!=='all'?'Try All buildings, or enable Search all buildings and enter a search.':'Try another name, extension or category.';
    listEl.innerHTML='<div class="empty-state"><div class="ico">'+(failed?'↻':'⌕')+'</div><h3>'+title+'</h3><p>'+description+'</p>'+(failed?'<button class="retry-button" data-action="retry">Try again</button>':'')+'</div>';return;
  }
  const groups=!words.length&&categoryFilter===null;let last=null;const html=[];
  for(const r of list){if(groups&&last!==r.category){html.push('<div class="section-label">'+escapeHtml(r.category)+'</div>');last=r.category;}
    const fav=favorites.has(makeKey(r));
    html.push('<div class="card"><button class="card-fav'+(fav?' active':'')+'" data-key="'+escapeHtml(makeKey(r))+'" aria-label="'+(fav?'Remove':'Add')+' favorite: '+escapeHtml(r.service)+'" aria-pressed="'+fav+'">★</button><div class="card-body"><div class="card-service">'+escapeHtml(r.service)+'</div>'+(groups?'':'<span class="card-category">'+escapeHtml(r.category)+'</span>')+'<span class="location-badge'+(r.scope==='unassigned'?' unassigned':'')+'">'+escapeHtml(locationLabel(r))+'</span></div><span class="card-ext">'+escapeHtml(r.extension)+'</span></div>');
  }
  listEl.innerHTML=html.join('');
}
function cancelRequest(){if(!activeRequest)return;clearTimeout(activeRequest.timer);activeRequest.script.remove();delete window[activeRequest.callbackName];activeRequest=null;}
function fetchData(attempt=0){
  clearTimeout(retryTimer);cancelRequest();
  const token=++requestToken;loadState='loading';render();
  const script=document.createElement('script'), callbackName='hospitalDirectoryResponse_'+token;
  function fail(message){if(!activeRequest||activeRequest.token!==token)return;cancelRequest();
    if(attempt===0){retryTimer=setTimeout(()=>fetchData(1),900);return;}
    loadState='error';render();showToast(message||'Could not load directory',false);
  }
  function accept(response){if(!activeRequest||activeRequest.token!==token)return;
    try {
      if(response&&response.error)throw new Error('The data service reported an error.');
      const next=normalizeRows(Array.isArray(response)?response:response?.rows);
      cancelRequest();data=next;lastUpdated=Date.now();loadState='ready';migrateFavorites();
      writeStorage(KEY_DATA,JSON.stringify({rows:data,updatedAt:lastUpdated}));syncBuildingControls();render();
    } catch(e){fail(e.message);}
  }
  activeRequest={token,script,callbackName,accept,timer:setTimeout(()=>fail('The data service timed out'),12000)};
  window[callbackName]=accept;
  try {const url=new URL(APPS_SCRIPT_URL);url.searchParams.set('callback',callbackName);url.searchParams.set('_',String(Date.now()));script.src=url.href;}catch(_){fail('Invalid data service URL');return;}
  script.async=true;script.onerror=()=>fail('Could not reach the data service');
  script.onload=()=>{if(activeRequest?.token===token)fail('The data service returned an invalid response');};
  document.body.appendChild(script);
}
// Supports the previous Apps Script, which always responds with callback([...]).
window.callback=response=>{if(activeRequest && document.currentScript===activeRequest.script)activeRequest.accept(response);};
$('buildingSelect').addEventListener('change',e=>{selectedBuilding=e.target.value;selectedDepartment=typeof departmentPreferences[selectedBuilding]==='string'?departmentPreferences[selectedBuilding]:'';categoryFilter=null;$('searchAll').checked=false;writeStorage(KEY_BUILDING,selectedBuilding);syncBuildingControls();render();listEl.scrollTop=0;});
$('departmentSelect').addEventListener('change',e=>{selectedDepartment=e.target.value;departmentPreferences[selectedBuilding]=selectedDepartment;writeStorage(KEY_DEPARTMENTS,JSON.stringify(departmentPreferences));categoryFilter=null;$('searchAll').checked=false;syncBuildingControls();render();listEl.scrollTop=0;});
$('searchAll').addEventListener('change',()=>{categoryFilter=null;render();});
$('categoryRow').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){categoryFilter=b.dataset.cat||null;render();}});
listEl.addEventListener('click',e=>{if(e.target.closest('[data-action="retry"]')){fetchData();return;}const b=e.target.closest('[data-key]');if(!b)return;const key=b.dataset.key;if(favorites.has(key))favorites.delete(key);else favorites.add(key);if(!writeStorage(KEY_FAV,JSON.stringify([...favorites])))showToast('Favorites could not be saved on this device',false);render();});
searchEl.addEventListener('input',e=>{queryString=e.target.value.trim();searchWrap.classList.toggle('has-text',!!queryString);render();});
$('searchClear').addEventListener('click',()=>{searchEl.value='';queryString='';searchWrap.classList.remove('has-text');render();searchEl.focus();});
$('chipAll').addEventListener('click',()=>{currentView='all';render();});$('chipFav').addEventListener('click',()=>{currentView='fav';render();});
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();settingsPop.classList.toggle('open');$('settingsBtn').setAttribute('aria-expanded',String(settingsPop.classList.contains('open')));});
function closeSettings(){settingsPop.classList.remove('open');$('settingsBtn').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{if(!settingsPop.contains(e.target)&&!$('settingsBtn').contains(e.target))closeSettings();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings();});
function applySize(){document.documentElement.style.setProperty('--base-size',baseSize+'px');$('sizeVal').textContent=baseSize+'px';}
function resize(delta){baseSize=Math.max(11,Math.min(20,baseSize+delta));applySize();writeStorage(KEY_SIZE,String(baseSize));}
$('sizeUp').addEventListener('click',()=>resize(1));$('sizeDown').addEventListener('click',()=>resize(-1));
livePill.addEventListener('click',()=>fetchData());
window.addEventListener('online',()=>{if(loadState==='error')fetchData();});
function init(){
  const savedSize=Number(readStorage(KEY_SIZE));if(savedSize>=11&&savedSize<=20)baseSize=savedSize;applySize();
  const fav=parseJSON(readStorage(KEY_FAV),[]);favorites=new Set(Array.isArray(fav)?fav.filter(v=>typeof v==='string'):[]);
  const cached=parseJSON(readStorage(KEY_DATA),null);
  if(cached){try{data=normalizeRows(Array.isArray(cached)?cached:cached.rows);lastUpdated=Number(cached.updatedAt)||0;}catch(_){data=[];}}
  migrateFavorites();syncBuildingControls();fetchData();
}
init();

</script>
